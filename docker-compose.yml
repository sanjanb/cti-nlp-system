services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cti-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - cti-network

networks:
  cti-network:
    driver: bridge
